  <circle cx="25" cy="316" r="11" fill="#0E1726" stroke="#F3F5F8" stroke-width="2"/>
  <text x="25" y="321.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="44" y="321.5" font-size="16" fill="#0E1726">A headless browser signs in with an email one-time code</text>
  <circle cx="25" cy="344" r="11" fill="#0E1726" stroke="#F3F5F8" stroke-width="2"/>
  <text x="25" y="349.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="44" y="349.5" font-size="16" fill="#0E1726">The bot calls the portal API to check each container</text>
  <circle cx="25" cy="372" r="11" fill="#0E1726" stroke="#F3F5F8" stroke-width="2"/>
  <text x="25" y="377.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="44" y="377.5" font-size="16" fill="#0E1726">A Telegram message is sent when a status changes</text>
</svg>
