<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">ALCES bot architecture</title>
  <desc id="d">A Telegram user talks to a Python bot on Railway. The bot keeps its state on a persistent data volume, uses a headless browser to sign in to the ALCES customs portal with an email one-time code, and calls the portal API to check containers.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E1726"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#F3F5F8"/>
  <rect x="158" y="10" width="292" height="272" rx="14" fill="none" stroke="#9AA7B8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="172" y="32" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#4B5768">Railway</text>
  <rect x="12" y="44" width="110" height="72" rx="10" fill="#FFFFFF" stroke="#0E1726" stroke-width="1.5"/>
  <text x="67.0" y="75.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0E1726">Telegram</text>
  <text x="67.0" y="97.0" text-anchor="middle" font-size="16" fill="#4B5768">user</text>
  <rect x="178" y="48" width="252" height="64" rx="10" fill="#FFFFFF" stroke="#0E1726" stroke-width="1.5"/>
  <text x="304.0" y="75.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0E1726">Python bot</text>
  <text x="304.0" y="97.0" text-anchor="middle" font-size="16" fill="#4B5768">tracks the containers</text>
  <path d="M178,179 a56.0,9 0 0 1 112,0 v52 a56.0,9 0 0 1 -112,0 z" fill="#FFFFFF" stroke="#0E1726" stroke-width="1.5"/>
  <path d="M178,179 a56.0,9 0 0 0 112,0" fill="none" stroke="#0E1726" stroke-width="1.5"/>
  <text x="234.0" y="211.0" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#0E1726">/data</text>
  <text x="234.0" y="233.0" text-anchor="middle" font-size="16" fill="#4B5768">volume</text>
  <rect x="318" y="170" width="112" height="70" rx="10" fill="#FFFFFF" stroke="#0E1726" stroke-width="1.5"/>
  <text x="374.0" y="200.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0E1726">Headless</text>
  <text x="374.0" y="222.0" text-anchor="middle" font-size="16" fill="#4B5768">browser</text>
  <rect x="490" y="150" width="138" height="110" rx="10" fill="#FFFFFF" stroke="#0E1726" stroke-width="1.5"/>
  <text x="559.0" y="189.0" text-anchor="middle" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0E1726">ALCES</text>
  <text x="559.0" y="211.0" text-anchor="middle" font-size="16" fill="#4B5768">customs</text>
  <text x="559.0" y="233.0" text-anchor="middle" font-size="16" fill="#4B5768">portal API</text>
