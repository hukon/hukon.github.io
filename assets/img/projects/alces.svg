  <path d="M234,114 V168" fill="none" stroke="#0E1726" stroke-width="1.8" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path d="M374,114 V168" fill="none" stroke="#0E1726" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M432,205 H488" fill="none" stroke="#0E1726" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M432,80 H559 V148" fill="none" stroke="#0E1726" stroke-width="1.8" marker-end="url(#ah)"/>
  <circle cx="150" cy="80" r="11" fill="#0E1726" stroke="#F3F5F8" stroke-width="2"/>
  <text x="150" y="85.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <circle cx="460" cy="205" r="11" fill="#0E1726" stroke="#F3F5F8" stroke-width="2"/>
  <text x="460" y="210.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
