<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Visa agency call-list app architecture</title>
  <desc id="d">Staff on a phone or laptop sign in with a password to a Node.js server on Railway. The server keeps records in a JSON store on a volume. One tap on a client number opens a phone call or WhatsApp.</desc>
